name: Release

# Release Please drives versioning (docs/RELEASING.md). Every push to main
# updates the release PR; merging that PR tags the commit and creates a draft
# GitHub release, which this workflow builds into and publishes once every
# platform succeeds. The draft keeps latest.json (the updater endpoint) and the
# Arch repo job (on: release published) from seeing a release without assets.
#
# Writes that must trigger other workflows (the release PR running CI, the
# publish event starting arch-repo.yml and site-deploy.yml) use a GitHub App
# token; events created with GITHUB_TOKEN never start new workflow runs.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and publish (e.g. v0.1.9)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}

  prepare:
    needs: release-please
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Draft releases are only listed for tokens with write access.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # A draft has no tag lookup in the API, so find it on the release list.
      - name: resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n1)
          if [ -z "$id" ]; then
            echo "::error::no release found for tag ${TAG}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  # Explicit conditions: on a manual rebuild release-please is skipped, and a
  # skipped ancestor otherwise skips every downstream job.
  build:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: '--target aarch64-apple-darwin'
            triple: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            tauri_script: ''
          - platform: macos-latest # Intel
            args: '--target x86_64-apple-darwin'
            triple: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            tauri_script: ''
          - platform: ubuntu-22.04
            # --verbose is a documented workaround: without it, linuxdeploy's
            # AppImage step fails on the CI runner (tauri-apps/tauri#14796).
            args: '--verbose'
            triple: x86_64-unknown-linux-gnu
            rust_targets: ''
            # Linux builds through a wrapper that shelters + repacks the bun
            # sidecar so the AppImage's sidecar is not corrupted (HOY-217).
            # tauri-action execs tauriScript directly via execa with cwd set to
            # projectPath (apps/desktop), with no shell, so workspace variables
            # do not expand there. A path relative to apps/desktop avoids that.
            tauri_script: 'bash ../../scripts/linux/build-appimage.sh'
          - platform: windows-latest
            args: ''
            triple: x86_64-pc-windows-msvc
            rust_targets: ''
            tauri_script: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target

      - name: install frontend dependencies
        run: bun install

      # externalBin is validated when tauri build evaluates the config, so the
      # per-triple sidecar binary must exist first. bash runs build.sh under Git
      # Bash on the Windows runner.
      - name: build sidecar
        shell: bash
        run: bash packages/sidecar/build.sh ${{ matrix.triple }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # AppImage bundling workarounds (Linux-only, ignored elsewhere). The
          # Linux updater consumes the AppImage; deb/rpm are not auto-updatable.
          # - extract-and-run: linuxdeploy is an AppImage, runner has no FUSE2.
          # - NO_STRIP: linuxdeploy's strip rejects modern .relr.dyn sections
          #   (tauri-apps/tauri#14755). Harmless on glibc 2.35 runners.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          # Updater signing (HOY-187). Without these the build still produces
          # installers, but the publish job refuses a release with no latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # Upload into the release Release Please created. With releaseId set,
          # tauri-action does not create or rename the release or touch its
          # body, so the generated changelog stays intact.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          # Empty on macOS/Windows (tauri-action auto-detects the build command);
          # Linux runs the shelter+repack wrapper (HOY-217).
          tauriScript: ${{ matrix.tauri_script }}

  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The in-app updater reads latest.json from the latest published release,
      # so never publish one that is missing a platform. Drafts have no tag
      # lookup in the API, so everything here goes by release id.
      - name: verify updater manifest
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          asset=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq '.assets[] | select(.name == "latest.json") | .id')
          if [ -z "$asset" ]; then
            echo "::error::release has no latest.json (are the updater signing secrets set?)"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}" > latest.json
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            if ! jq -e --arg p "$platform" '.platforms[$p].signature | length > 0' latest.json >/dev/null; then
              echo "::error::latest.json has no signed entry for ${platform}"
              exit 1
            fi
          done

      # Published with the App token so the release event starts arch-repo.yml.
      - name: publish release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          endpoint="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          if [ "$(gh api "$endpoint" --jq .draft)" = "true" ]; then
            gh api -X PATCH "$endpoint" -F draft=false -f make_latest=true --jq '.html_url'
          else
            echo "release ${RELEASE_ID} is already published"
          fi

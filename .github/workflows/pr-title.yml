name: PR title

# PRs are squash-merged with the PR title as the commit message, and Release
# Please reads those commits to pick the version bump and write the changelog
# (docs/RELEASING.md). Enforce Conventional Commits on the title, e.g.
# "feat(HOY-312): limit thinking levels per model".

# pull_request (not pull_request_target) so the check runs from the PR's own
# workflow file and never gets write access or secrets; it only reads the title
# from the event payload.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with changelog-sections in release-please-config.json.
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            refactor
            test
            build
            ci
            chore
            style
          requireScope: false
          # Release Please's own PR ("chore: release 0.1.9") already conforms.
          subjectPattern: ^[^A-Z].*$
          subjectPatternError: |
            Start the subject with a lowercase letter, e.g.
            "feat(HOY-312): limit thinking levels per model".

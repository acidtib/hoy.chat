name: PR title

# PRs are squash-merged and the title becomes the commit Release Please reads,
# so it must be a Conventional Commit. Same script as `bun run check:pr-title`.
# pull_request, not pull_request_target: no write access or secrets needed.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs "$PR_TITLE"
